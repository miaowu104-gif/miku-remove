# miku-voicebank - 卸载演出配置
#
# 放在这里的是默认配置。想改又不想动这个文件，就复制一份到
#   %APPDATA%\miku-voicebank\show.conf
# 那边优先级更高；命令行参数再高一级；所有键都能用环境变量覆盖，
# 加 MIKU_ 前缀即可，例如 MIKU_NO_AUDIO=1。
#
# 注意：只会读「第一个存在」的配置文件，不是层层叠加。

# 播放的歌曲。
#   AUDIO     = 本地文件路径，留空表示去 audio\ 和下载缓存里找
#   AUDIO_URL = 下载地址，本地找不到时用它；下完会缓存，下次直接用缓存
AUDIO=
AUDIO_URL=https://fms.uiero.com/downloads/mkrm.mp3

# 下载缓存放哪（留空 = %LOCALAPPDATA%\miku-voicebank\cache\）
AUDIO_CACHE=

# 下载超时与重试次数
AUDIO_FETCH_TIMEOUT=30
AUDIO_FETCH_RETRIES=2

# 播放器。Windows 版只有一种实现（WPF MediaPlayer），这个键保留只是为了
# 配置文件键名齐全；写什么都一样。
PLAYER=auto

# 音量 0-100（留空 = 100）
AUDIO_VOLUME=

# 从歌曲的第几秒开始播放。0 = 从头（这段录音前面还有一段安静的前奏）。
AUDIO_START=0

# 歌词整体平移秒数，用来微调对齐；负数表示歌词提前。
# 可用 `miku-remove.cmd --calibrate` 边听边调，按 s 保存到
# %APPDATA%\miku-voicebank\show.conf
AUDIO_OFFSET=0

# 1 = 不放声音，只输出歌词
NO_AUDIO=0

# 进度条样式：
#   scroll = 每秒一行往上刷：(1/2) 正在删除 miku [##--] 34%  01:25 / 04:09，
#            检查包完整性的 20%/60%/80%/100% 四步也都看得见（Windows 版默认）
#   inline = 只有固定在最后一行的一条状态栏，不往上滚
#   off    = 完全不显示进度条
STATUS_STYLE=scroll

# 0 = 关闭颜色
COLOR=1

# 演出速度倍率，1 = 正常。仅用于测试，例如 MIKU_SPEED=40
SPEED=1.0

# 1 = 即使输出被重定向（没有终端）也老老实实演满全场
FORCE=0

# 1 = 演出开始前，先杀掉残留的旧播放进程
KILL_STRAY=1

# 卸载摘要里显示的数字，纯装饰
PACK_COUNT=51
TOTAL_SIZE=5.4 GiB

# 1 = 连 winget 的输出一起演：开头的 Found/Version/Publisher、51 个组件的列表、
#     贯穿全程的 "Uninstalling miku-voicebank-packN (4.0)..."、
#     以及钉在屏幕最下面的方块进度条。
#     0 = 只留 [VOCALOID] 和歌词（命令行 --no-winget 同效）
WINGET=1

# 1 = 连开头"装上去"的过程一起演：winget install Miku.Voicebank、
#     下载与校验、52 个组件的注册、最后的 Successfully installed。
#     0 = 直接从卸载开始（命令行 --no-install 同效）
WINGET_INSTALL=1

# 安装阶段每一步的间隔（毫秒）。一共 52 步注册，
# 默认 120 约合 6 秒；嫌慢就调小（60 约 3 秒），0 = 一次全部打完。
# 命令行：--install-pace 60
INSTALL_PACE=120
